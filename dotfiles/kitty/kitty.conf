# ==============================================================================
# ARQUIVO DE CONFIGURAÇÃO DO KITTY (~/.config/kitty/kitty.conf)
# ==============================================================================

include ./theme.conf

# ------------------------------------------------------------------------------
# 1. FONTES
# ------------------------------------------------------------------------------
# Define a fonte principal. Recomendo usar uma "Nerd Font" para ter ícones no terminal.
# font_family      FiraCode Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# Tamanho da fonte em pts.
font_size 13.0

# Habilitar ou desabilitar ligaturas (ex: transformar != em um símbolo único).
# Opções: always, never, cursor (desativa onde o cursor está)
# disable_ligatures never


# ------------------------------------------------------------------------------
# 2. MOUSE E ÁREA DE TRANSFERÊNCIA
# ------------------------------------------------------------------------------
# Copia automaticamente o texto selecionado para a área de transferência.
# Opções: yes (copia para o clipboard primário do Linux), clipboard (copia para o Ctrl+C normal), no
copy_on_select clipboard

# Esconde o mouse após X segundos sem movimento (0 desativa).
# mouse_hide_wait 3.0

# Colar com Ctrl+V
map ctrl+v paste_from_clipboard

# Nova aba com Ctrl+T
map ctrl+t new_tab


# ------------------------------------------------------------------------------
# 3. CURSOR
# ------------------------------------------------------------------------------
# Formato do cursor.
# Opções: block (bloco), beam (linha vertical, tipo editor de texto), underline (linha embaixo)
# cursor_shape block

# Controla se o cursor pisca.
# Opções: 0 (desativa), valores em segundos (ex: 0.5)
# cursor_blink_interval 0.5


# ------------------------------------------------------------------------------
# 4. JANELA E LAYOUT
# ------------------------------------------------------------------------------
# Margem interna da janela (em pixels). Ajuda o texto a não colar nas bordas.
# window_padding_width 4

# Lembrar o tamanho da última janela fechada ao abrir uma nova.
# Opções: yes, no
# remember_window_size  yes

# Opacidade do fundo (requer um compositor de janelas rodando no Linux, como o Picom ou o do Wayland).
# Valores de 0.0 (totalmente transparente) a 1.0 (totalmente opaco).
# background_opacity 0.95

# Blur no fundo transparente (só funciona no KDE/Wayland ou macOS nativamente).
# background_blur 0

# Cor da titlebar no Wayland (o GNOME/mutter não aplica o tema GTK nela por padrão,
# então aqui ela é forçada a acompanhar a cor de fundo do terminal).
wayland_titlebar_color background

# Roda via XWayland para o compositor (Mutter/KWin) desenhar a barra de título nativa.
# Para voltar ao Wayland nativo, troque para "auto".
linux_display_server auto


# ------------------------------------------------------------------------------
# 5. ABAS (TABS)
# ------------------------------------------------------------------------------
# Estilo da barra de abas.
# Opções: fade, slant (estilo navegador moderno), separator, powerline, hidden
tab_bar_style slant

# Posição da barra de abas.
# Opções: top, bottom
tab_bar_edge top


# ------------------------------------------------------------------------------
# 6. DESEMPENHO E SISTEMA (GPU)
# ------------------------------------------------------------------------------
# O Kitty já usa a GPU por padrão. Estas opções ajudam a ajustar a fluidez.

# Sincronizar a renderização com a taxa de atualização do monitor (V-Sync).
# Evita "screen tearing", mas pode ser desligado (no) para latência mínima.
# sync_to_monitor yes

# Atrasa a renderização em milissegundos para economizar CPU/Bateria.
# O padrão é 10. Para máxima fluidez (em monitores de 144hz+), pode abaixar para 2 ou 1.
# repaint_delay 10


# ------------------------------------------------------------------------------
# 7. CORES E TEMAS
# ------------------------------------------------------------------------------
# Você pode definir cores hexadecimais manualmente ou importar um tema.
# foreground #dddddd
# background #000000
#
# Para usar um tema pronto, basta incluir o arquivo do tema aqui no final:
# include ./themes/dracula.conf


# ------------------------------------------------------------------------------
# 8. SONS E NOTIFICAÇÕES
# ------------------------------------------------------------------------------
# Toca o som e mostra notificação quando um comando de mais de 5s termina
# com a janela fora de foco.
# Opções: never, unfocused, invisible, always / ações: notify, bell, notify-bell
notify_on_cmd_finish unfocused 5.0 notify-bell

# ------------------------------------------------------------------------------
# 9. JANELAS DIVIDIDAS
# ------------------------------------------------------------------------------
# Define F5 para dividir a janela horizontalmente e F6 verticalmente
enabled_layouts splits
map f5 launch --location=hsplit
map f6 launch --location=vsplit   
