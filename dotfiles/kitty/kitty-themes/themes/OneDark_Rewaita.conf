# One Dark adapted to the GTK4 / GNOME Shell theme generated by Rewaita
# ("One Dark ⚛️", cool variant, accent color: red), based on ./OneDark.conf.
#   background  -> #232b39 (window-bg-color)
#   foreground  -> #abb2bf (window-fg-color / light-1)
#   cursor      -> #e06c75 (GNOME accent-color: red)
#   selection   -> #383f4a (brown-3)
#   tab bar     -> sidebar-bg-color / card-bg-color
#   color0/8    -> aligned with the new background so black tones don't clash

background  #232b39
foreground  #abb2bf

cursor                #e06c75
cursor_text_color     #232b39

selection_foreground  none
selection_background  #383f4a

url_color             #61afef

# tab bar
tab_bar_background      #1d242f
active_tab_background   #2c3344
active_tab_foreground   #abb2bf
inactive_tab_background #1d242f
inactive_tab_foreground #5c6370

# black
color0  #232b39
color8  #5c6370

# red
color1                #e06c75
# light red
color9                #e06c75

# green
color2                #98c379
# light green
color10               #98c379

# yellow
color3                #e5c07b
# light yellow
color11               #e5c07b

# blue
color4                #61afef
# light blue
color12               #61afef

# magenta
color5                #c678dd
# light magenta
color13               #c678dd

# cyan
color6                #56b6c2
# light cyan
color14               #56b6c2

# light gray
color7                #abb2bf
# white
color15               #c8ccd4
