# Gruvbox Medium adapted to the GTK4 / GNOME Shell theme generated by Rewaita
# ("Gruvbox Medium 🌴", accent color: red), based on the gruvbox dark palette.
#   background  -> #282828 (window-bg-color)
#   foreground  -> #ebdbb2 (window-fg-color / light-1)
#   cursor      -> #fb4934 (GNOME accent-color: red)
#   selection   -> #504945 (dark-1)
#   tab bar     -> headerbar-bg-color / card-bg-color

background  #282828
foreground  #ebdbb2

cursor                #fb4934
cursor_text_color     #282828

selection_foreground  none
selection_background  #504945

url_color             #83a598

# tab bar
tab_bar_background      #1d2021
active_tab_background   #3c3a36
active_tab_foreground   #ebdbb2
inactive_tab_background #1d2021
inactive_tab_foreground #928374

