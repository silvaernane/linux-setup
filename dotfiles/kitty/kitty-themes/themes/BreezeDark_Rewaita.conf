# Breeze Dark adapted to the GTK4 / GNOME Shell theme generated by Rewaita
# ("Breeze Dark 🎐", accent color: red), with ANSI colors from KDE Konsole's Breeze scheme.
#   background  -> #2a2e32 (window-bg-color)
#   foreground  -> #fcfcfc (window-fg-color)
#   cursor      -> #f66050 (GNOME accent-color: red)
#   selection   -> #4d5357 (Breeze button background)
#   tab bar     -> headerbar-bg-color / view-bg-color

background  #2a2e32
foreground  #fcfcfc

cursor                #f66050
cursor_text_color     #2a2e32

selection_foreground  none
selection_background  #4d5357

url_color             #3daee9

# tab bar
tab_bar_background      #1b1e20
active_tab_background   #31363b
active_tab_foreground   #fcfcfc
inactive_tab_background #1b1e20
inactive_tab_foreground #7f8c8d

# black
color0  #232627
color8  #7f8c8d

# red
color1                #ed1515
# light red
color9                #c0392b

# green
color2                #11d116
# light green
color10               #1cdc9a

# yellow
color3                #f67400
# light yellow
color11               #fdbc4b

# blue
color4                #1d99f3
# light blue
color12               #3daee9

# magenta
color5                #9b59b6
# light magenta
color13               #8e44ad

# cyan
color6                #1abc9c
# light cyan
color14               #16a085

# light gray
color7                #fcfcfc
# white
color15               #ffffff
