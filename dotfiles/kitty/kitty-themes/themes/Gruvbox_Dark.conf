# Adapted to match the current GTK4 / GNOME Shell theme generated by Rewaita
# (Gruvbox palette, accent color: red):
#   background  -> #1d2021 (window-bg-color / sidebar-bg-color)
#   foreground  -> #fbf1c7 (window-fg-color / light0)
#   cursor      -> #fb4934 (GNOME accent-color: red)
#   selection   -> #504945 (sidebar-border-color, same tone GTK uses for outlines)
#   color0/8    -> aligned with the new background so black tones don't clash

background  #1d2021
foreground  #fbf1c7

cursor                #fb4934

selection_foreground  #1d2021
selection_background  #504945

color0  #1d2021
color8  #928374

# red
color1                #cc241d
# light red
color9                #fb4934

# green
color2                #98971a
# light green
color10               #b8bb26

# yellow
color3                #d79921
# light yellow
color11               #fabd2d

# blue
color4                #458588
# light blue
color12               #83a598

# magenta
color5                #b16286
# light magenta
color13               #d3869b

# cyan
color6                #689d6a
# lighy cyan
color14               #8ec07c

# light gray
color7                #a89984
# dark gray
color15               #928374
